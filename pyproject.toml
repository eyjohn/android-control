[project]
name = "android-control"
version = "0.1.0"
description = "Pure AccessibilityService remote phone control over P2P WebRTC DataChannel with Firebase signaling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.9.0",
    "pillow>=10.3.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
]

[project.scripts]
android-ctl = "android_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "types-Pillow>=10.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

